<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>32 Entregas — Cliente</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { margin: 0; padding: 14px; background: #0d1117; color: #f0f6fc; display: flex; justify-content: center; }
    .app { width: 100%; max-width: 520px; background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 16px; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }
    .badge { font-size: 0.75rem; font-weight: bold; padding: 4px 8px; border-radius: 999px; background: #1f6feb; color: #fff; }
    .voltar { font-size: 0.82rem; color: #79c0ff; text-decoration: none; font-weight: bold; }
    h1 { margin: 0 0 4px; font-size: 1.25rem; }
    .sub { color: #8b949e; font-size: 0.82rem; margin-bottom: 12px; }
    label { display: block; margin-top: 10px; margin-bottom: 4px; font-size: 0.84rem; color: #c9d1d9; font-weight: bold; }
    input, select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: #f0f6fc; font-size: 0.95rem; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn { width: 100%; padding: 11px; border: none; border-radius: 8px; font-weight: bold; font-size: 0.94rem; cursor: pointer; margin-top: 10px; text-decoration: none; display: block; text-align: center; }
    .btn-green { background: #238636; color: #fff; }
    .btn-blue { background: #1f6feb; color: #fff; }
    .btn-gray { background: #21262d; color: #f0f6fc; border: 1px solid #30363d; }
    .card { margin-top: 14px; padding: 12px; border-radius: 8px; background: #0d1117; border: 1px solid #30363d; }
    .msg-box { margin-top: 8px; padding: 10px; border-radius: 8px; background: #161b22; border: 1px dashed #484f58; font-size: 0.85rem; white-space: pre-line; color: #e6edf3; }
    .notice { margin-top: 8px; font-size: 0.82rem; color: #79c0ff; min-height: 18px; }
    .saved-item { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px; margin-top: 8px; border-radius: 8px; background: #161b22; border: 1px solid #30363d; font-size: 0.84rem; }
    .mini-btns { display: flex; gap: 6px; }
    .mini-btn { padding: 6px 8px; border: none; border-radius: 6px; font-size: 0.78rem; font-weight: bold; cursor: pointer; color: #fff; }
  </style>
</head>
<body>
  <div class="app">
    <div class="top-bar">
      <span class="badge">PAINEL DO CLIENTE</span>
      <a class="voltar" href="./index.html">← Voltar ao Início</a>
    </div>

    <h1>32 Entregas</h1>
    <div class="sub">Rio Grande / Cassino • Solicitação de entrega</div>

    <label for="nomeCliente">Nome do Cliente</label>
    <input id="nomeCliente" type="text" placeholder="Ex: Tati" />

    <label for="whatsCliente">WhatsApp do Cliente (com DDD)</label>
    <input id="whatsCliente" type="tel" placeholder="53999999999" />

    <label for="origem">Origem / Retirada</label>
    <input id="origem" type="text" placeholder="Ex: Balneário Cassino" />

    <label for="paradas">Lojas / Paradas (opcional)</label>
    <input id="paradas" type="text" placeholder="Ex: Loja A e Loja B" />

    <label for="destino">Destino / Entrega</label>
    <input id="destino" type="text" placeholder="Ex: Centro, Rio Grande" />

    <div class="row">
      <div>
        <label for="modal">Modal</label>
        <select id="modal">
          <option value="Bicicleta">Bicicleta</option>
          <option value="Moto">Moto</option>
          <option value="Carro">Carro</option>
        </select>
      </div>
      <div>
        <label for="valorEstimado">Valor da Entrega (R$)</label>
        <input id="valorEstimado" type="number" step="0.50" value="10.00" />
      </div>
    </div>

    <label for="whatsDestino">WhatsApp de Envio (Admin / Central)</label>
    <input id="whatsDestino" type="tel" placeholder="53999089980" />

    <button class="btn btn-blue" onclick="salvarCliente()">Salvar Cadastro do Cliente</button>
    <button class="btn btn-gray" onclick="limparCampos()">Limpar Campos</button>
    <div class="notice" id="aviso"></div>

    <div class="card">
      <strong>Clientes Salvos neste Aparelho</strong>
      <div id="listaClientesSalvos"></div>
    </div>

    <button class="btn btn-green" onclick="gerarPedido()">Gerar Pedido e Liberar WhatsApp</button>

    <div class="card" id="boxEnvio" style="display:none;">
      <div class="msg-box" id="textoPedido"></div>
      <a class="btn btn-green" id="linkWhats" href="#" target="_blank" rel="noopener">
        Enviar Pedido no WhatsApp
      </a>
      <button class="btn btn-gray" onclick="copiarPedido()">Copiar Mensagem</button>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'cliente32Entregas_repo_v1';

    function obterClientes() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      } catch (e) {
        return [];
      }
    }

    function salvarListaClientes(lista) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(lista));
      } catch (e) {}
    }

    function normalizarFone(num) {
      const digitos = (num || '').replace(/\D/g, '');
      if (!digitos) return '';
      return digitos.startsWith('55') ? digitos : '55' + digitos;
    }

    function formatarValor(v) {
      return Number(v || 0).toFixed(2).replace('.', ',');
    }

    function salvarCliente() {
      const nome = document.getElementById('nomeCliente').value.trim();
      const whatsCliente = document.getElementById('whatsCliente').value.trim();
      const origem = document.getElementById('origem').value.trim();
      const paradas = document.getElementById('paradas').value.trim();
      const destino = document.getElementById('destino').value.trim();
      const modal = document.getElementById('modal').value;
      const valorEstimado = document.getElementById('valorEstimado').value;
      const whatsDestino = document.getElementById('whatsDestino').value.trim();
      const aviso = document.getElementById('aviso');

      if (!nome) {
        aviso.textContent = 'Preencha o nome do cliente para salvar.';
        return;
      }

      const lista = obterClientes();
      const dados = {
        id: Date.now(),
        nome,
        whatsCliente,
        origem,
        paradas,
        destino,
        modal,
        valorEstimado,
        whatsDestino
      };

      const existente = lista.findIndex(item => item.nome.toLowerCase() === nome.toLowerCase());
      if (existente >= 0) {
        lista[existente] = dados;
        aviso.textContent = `Cadastro de "${nome}" atualizado.`;
      } else {
        lista.unshift(dados);
        aviso.textContent = `Cliente "${nome}" salvo.`;
      }

      salvarListaClientes(lista);
      renderizarLista();
    }

    function usarCliente(id) {
      const item = obterClientes().find(c => c.id === id);
      if (!item) return;

      document.getElementById('nomeCliente').value = item.nome || '';
      document.getElementById('whatsCliente').value = item.whatsCliente || '';
      document.getElementById('origem').value = item.origem || '';
      document.getElementById('paradas').value = item.paradas || '';
      document.getElementById('destino').value = item.destino || '';
      document.getElementById('modal').value = item.modal || 'Bicicleta';
      document.getElementById('valorEstimado').value = item.valorEstimado ?? '10.00';
      document.getElementById('whatsDestino').value = item.whatsDestino || '';
      document.getElementById('aviso').textContent = `Dados de "${item.nome}" carregados.`;
    }

    function removerCliente(id) {
      const lista = obterClientes().filter(c => c.id !== id);
      salvarListaClientes(lista);
      renderizarLista();
      document.getElementById('aviso').textContent = 'Cliente removido.';
    }

    function limparCampos() {
      ['nomeCliente', 'whatsCliente', 'origem', 'paradas', 'destino', 'whatsDestino'].forEach(id => {
        document.getElementById(id).value = '';
      });
      document.getElementById('modal').value = 'Bicicleta';
      document.getElementById('valorEstimado').value = '10.00';
      document.getElementById('aviso').textContent = 'Campos limpos.';
    }

    function renderizarLista() {
      const alvo = document.getElementById('listaClientesSalvos');
      const lista = obterClientes();

      if (!lista.length) {
        alvo.innerHTML = '<div class="sub" style="margin-top:8px; margin-bottom:0;">Nenhum cliente salvo neste aparelho.</div>';
        return;
      }

      alvo.innerHTML = lista.map(c => `
        <div class="saved-item">
          <div>
            <strong>${c.nome}</strong><br />
            <span style="color:#8b949e;">${c.origem || 'Sem origem'} → ${c.destino || 'Sem destino'} (${c.modal})</span>
          </div>
          <div class="mini-btns">
            <button class="mini-btn" style="background:#1f6feb;" onclick="usarCliente(${c.id})">Usar</button>
            <button class="mini-btn" style="background:#da3633;" onclick="removerCliente(${c.id})">X</button>
          </div>
        </div>
      `).join('');
    }

    function gerarPedido() {
      const nome = document.getElementById('nomeCliente').value.trim();
      const whatsCliente = document.getElementById('whatsCliente').value.trim();
      const origem = document.getElementById('origem').value.trim();
      const paradas = document.getElementById('paradas').value.trim();
      const destino = document.getElementById('destino').value.trim();
      const modal = document.getElementById('modal').value;
      const valor = document.getElementById('valorEstimado').value;
      const foneDestino = normalizarFone(document.getElementById('whatsDestino').value);
      const aviso = document.getElementById('aviso');

      if (!nome || !origem || !destino) {
        aviso.textContent = 'Preencha Nome do Cliente, Origem e Destino.';
        return;
      }

      const texto = [
        '*32 ENTREGAS - NOVO PEDIDO*',
        `Cliente: ${nome}`,
        whatsCliente ? `WhatsApp Cliente: ${whatsCliente}` : null,
        `Origem: ${origem}`,
        `Lojas/Paradas: ${paradas || 'Sem paradas extras'}`,
        `Destino: ${destino}`,
        `Modal: ${modal}`,
        `Valor: R$ ${formatarValor(valor)}`
      ].filter(Boolean).join('\n');

      document.getElementById('textoPedido').textContent = texto;
      document.getElementById('boxEnvio').style.display = 'block';

      const link = document.getElementById('linkWhats');
      if (foneDestino) {
        link.href = `https://wa.me/${foneDestino}?text=${encodeURIComponent(texto)}`;
        link.style.pointerEvents = 'auto';
        link.style.opacity = '1';
        aviso.textContent = 'Pedido pronto para enviar no WhatsApp.';
      } else {
        link.href = '#';
        link.style.pointerEvents = 'none';
        link.style.opacity = '0.5';
        aviso.textContent = 'Informe o WhatsApp de envio (com DDD) para habilitar o link.';
      }
    }

    function copiarPedido() {
      const txt = document.getElementById('textoPedido').textContent;
      if (!txt) return;
      navigator.clipboard?.writeText(txt);
      document.getElementById('aviso').textContent = 'Mensagem copiada.';
    }

    renderizarLista();
  </script>
</body>
</html>
