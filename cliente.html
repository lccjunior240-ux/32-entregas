<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>32 Entregas — Painel do Cliente</title>
  <style>
    :root {
      --azul-marinho: #07192f;
      --azul-card: #0c2442;
      --azul-borda: #183b66;
      --amarelo: #ffd400;
      --amarelo-hover: #f2c500;
      --texto: #ffffff;
      --texto-suave: #b8cde6;
      --verde: #198754;
      --vermelho: #dc3545;
    }

    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body {
      margin: 0;
      padding: 14px;
      background: var(--azul-marinho);
      color: var(--texto);
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 520px;
      background: var(--azul-card);
      border: 2px solid var(--amarelo);
      border-radius: 14px;
      padding: 16px;
    }

    .header-brand {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--amarelo);
      padding-bottom: 10px;
      margin-bottom: 12px;
    }

    .brand-title {
      margin: 0;
      font-size: 1.3rem;
      color: var(--amarelo);
      font-weight: bold;
    }

    .brand-tag {
      background: var(--amarelo);
      color: var(--azul-marinho);
      font-weight: bold;
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 999px;
    }

    .sub {
      color: var(--texto-suave);
      font-size: 0.84rem;
      margin-bottom: 12px;
    }

    label {
      display: block;
      margin-top: 10px;
      margin-bottom: 4px;
      font-size: 0.85rem;
      color: var(--amarelo);
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--azul-borda);
      background: var(--azul-marinho);
      color: var(--texto);
      font-size: 0.95rem;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--amarelo);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 10px;
      text-align: center;
    }

    .btn-amarelo {
      background: var(--amarelo);
      color: var(--azul-marinho);
    }

    .btn-amarelo:hover {
      background: var(--amarelo-hover);
    }

    .btn-verde {
      background: var(--verde);
      color: #ffffff;
    }

    .btn-azul {
      background: #12355e;
      color: var(--texto);
      border: 1px solid var(--amarelo);
    }

    .card {
      margin-top: 14px;
      padding: 12px;
      border-radius: 10px;
      background: var(--azul-marinho);
      border: 1px solid var(--azul-borda);
    }

    .card-titulo {
      color: var(--amarelo);
      font-weight: bold;
      font-size: 0.92rem;
      margin-bottom: 6px;
      display: block;
    }

    .notice {
      margin-top: 8px;
      font-size: 0.84rem;
      color: var(--amarelo);
      min-height: 18px;
    }

    .saved-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 8px;
      margin-top: 8px;
      border-radius: 8px;
      background: var(--azul-card);
      border: 1px solid var(--azul-borda);
      font-size: 0.84rem;
    }

    .mini-btns {
      display: flex;
      gap: 6px;
    }

    .mini-btn {
      padding: 6px 9px;
      border: none;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: bold;
      cursor: pointer;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header-brand">
      <div class="brand-title">32 ENTREGAS</div>
      <span class="brand-tag">32 BIKE • CLIENTE</span>
    </div>
    <div class="sub">Solicitação de entrega e envio para o painel do entregador</div>

    <label for="nomeCliente">Nome do Cliente</label>
    <input id="nomeCliente" type="text" placeholder="Ex: Tati" />

    <label for="whatsCliente">WhatsApp do Cliente (com DDD)</label>
    <input id="whatsCliente" type="tel" placeholder="53999999999" />

    <label for="origem">Origem / Retirada</label>
    <input id="origem" type="text" placeholder="Ex: Balneário Cassino" />

    <label for="paradas">Lojas / Paradas (opcional)</label>
    <input id="paradas" type="text" placeholder="Ex: Loja A e Loja B" />

    <label for="destino">Destino / Entrega</label>
    <input id="destino" type="text" placeholder="Ex: Centro, Rio Grande" />

    <div class="row">
      <div>
        <label for="modal">Modal</label>
        <select id="modal">
          <option value="Bicicleta">Bicicleta</option>
          <option value="Moto">Moto</option>
          <option value="Carro">Carro</option>
        </select>
      </div>
      <div>
        <label for="valorEntrega">Valor da Entrega (R$)</label>
        <input id="valorEntrega" type="number" step="0.50" value="10.00" />
      </div>
    </div>

    <button type="button" class="btn btn-amarelo" id="btnSalvarCliente">Salvar Dados do Cliente</button>
    <button type="button" class="btn btn-azul" id="btnLimparCampos">Limpar Campos</button>
    <button type="button" class="btn btn-verde" id="btnEnviarEntregador">Enviar para o Painel do Entregador</button>
    <div class="notice" id="aviso"></div>

    <div class="card">
      <span class="card-titulo">Clientes Salvos neste Aparelho</span>
      <div id="listaClientesSalvos"></div>
    </div>
  </div>

  <script>
    const CHAVE_CLIENTES = 'clientes32Entregas_azulAmarelo_v2';
    const CHAVE_CHAMADO = 'chamadoEntregador32Entregas_v2';

    function lerClientes() {
      try {
        return JSON.parse(localStorage.getItem(CHAVE_CLIENTES) || '[]');
      } catch (e) {
        return [];
      }
    }

    function gravarClientes(lista) {
      try {
        localStorage.setItem(CHAVE_CLIENTES, JSON.stringify(lista));
      } catch (e) {}
    }

    function mostrarAviso(texto) {
      document.getElementById('aviso').textContent = texto || '';
    }

    function pegarDadosFormulario() {
      return {
        nome: document.getElementById('nomeCliente').value.trim(),
        whatsCliente: document.getElementById('whatsCliente').value.trim(),
        origem: document.getElementById('origem').value.trim(),
        paradas: document.getElementById('paradas').value.trim(),
        destino: document.getElementById('destino').value.trim(),
        modal: document.getElementById('modal').value,
        valorEntrega: document.getElementById('valorEntrega').value
      };
    }

    function salvarCliente() {
      const dados = pegarDadosFormulario();
      if (!dados.nome) {
        mostrarAviso('Informe o nome do cliente para salvar.');
        return;
      }

      const lista = lerClientes();
      const registro = Object.assign({ id: Date.now() }, dados);
      const idx = lista.findIndex(c => c.nome.toLowerCase() === dados.nome.toLowerCase());

      if (idx >= 0) {
        lista[idx] = registro;
        mostrarAviso(`Cliente "${dados.nome}" atualizado.`);
      } else {
        lista.unshift(registro);
        mostrarAviso(`Cliente "${dados.nome}" salvo.`);
      }

      gravarClientes(lista);
      renderizarLista();
    }

    function carregarCliente(id) {
      const item = lerClientes().find(c => c.id === id);
      if (!item) return;

      document.getElementById('nomeCliente').value = item.nome || '';
      document.getElementById('whatsCliente').value = item.whatsCliente || '';
      document.getElementById('origem').value = item.origem || '';
      document.getElementById('paradas').value = item.paradas || '';
      document.getElementById('destino').value = item.destino || '';
      document.getElementById('modal').value = item.modal || 'Bicicleta';
      document.getElementById('valorEntrega').value = item.valorEntrega ?? '10.00';
      mostrarAviso(`Dados de "${item.nome}" carregados.`);
    }

    function excluirCliente(id) {
      const lista = lerClientes().filter(c => c.id !== id);
      gravarClientes(lista);
      renderizarLista();
      mostrarAviso('Cadastro removido.');
    }

    function limparCampos() {
      ['nomeCliente', 'whatsCliente', 'origem', 'paradas', 'destino'].forEach(id => {
        document.getElementById(id).value = '';
      });
      document.getElementById('modal').value = 'Bicicleta';
      document.getElementById('valorEntrega').value = '10.00';
      mostrarAviso('Campos limpos.');
    }

    function enviarParaPainelEntregador() {
      const dados = pegarDadosFormulario();
      if (!dados.nome || !dados.origem || !dados.destino) {
        mostrarAviso('Preencha Nome do Cliente, Origem e Destino antes de enviar.');
        return;
      }

      const chamado = Object.assign({}, dados, {
        status: 'Enviado ao entregador',
        atualizadoEm: new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })
      });

      try {
        localStorage.setItem(CHAVE_CHAMADO, JSON.stringify(chamado));
        mostrarAviso(`Pedido enviado para o painel do entregador (${chamado.atualizadoEm}).`);
      } catch (e) {
        mostrarAviso('Não foi possível salvar no navegador deste aparelho.');
      }
    }

    function renderizarLista() {
      const alvo = document.getElementById('listaClientesSalvos');
      const lista = lerClientes();

      if (!lista.length) {
        alvo.innerHTML = '<div class="sub" style="margin:6px 0 0;">Nenhum cliente salvo ainda.</div>';
        return;
      }

      alvo.innerHTML = lista.map(c => `
        <div class="saved-item">
          <div>
            <strong style="color:#ffd400;">${c.nome}</strong><br />
            <span style="color:#b8cde6;">${c.origem || 'Sem origem'} → ${c.destino || 'Sem destino'} (${c.modal})</span>
          </div>
          <div class="mini-btns">
            <button type="button" class="mini-btn" style="background:#198754;" data-usar="${c.id}">Usar</button>
            <button type="button" class="mini-btn" style="background:#dc3545;" data-excluir="${c.id}">X</button>
          </div>
        </div>
      `).join('');

      alvo.querySelectorAll('[data-usar]').forEach(btn => {
        btn.addEventListener('click', () => carregarCliente(Number(btn.getAttribute('data-usar'))));
      });

      alvo.querySelectorAll('[data-excluir]').forEach(btn => {
        btn.addEventListener('click', () => excluirCliente(Number(btn.getAttribute('data-excluir'))));
      });
    }

    document.getElementById('btnSalvarCliente').addEventListener('click', salvarCliente);
    document.getElementById('btnLimparCampos').addEventListener('click', limparCampos);
    document.getElementById('btnEnviarEntregador').addEventListener('click', enviarParaPainelEntregador);

    renderizarLista();
  </script>
</body>
</html>
