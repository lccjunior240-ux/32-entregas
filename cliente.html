<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>32 Entregas — Cliente</title>
  <style>
    :root {
      --azul-marinho: #07192f;
      --azul-card: #0c2442;
      --azul-borda: #183b66;
      --amarelo: #ffd400;
      --amarelo-hover: #f2c500;
      --texto: #ffffff;
      --texto-suave: #b8cde6;
      --verde: #198754;
      --vermelho: #dc3545;
    }

    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body {
      margin: 0;
      padding: 14px;
      background: var(--azul-marinho);
      color: var(--texto);
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 520px;
      background: var(--azul-card);
      border: 2px solid var(--amarelo);
      border-radius: 14px;
      padding: 16px;
    }

    .header-brand {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--amarelo);
      padding-bottom: 10px;
      margin-bottom: 12px;
    }

    .brand-title {
      margin: 0;
      font-size: 1.3rem;
      color: var(--amarelo);
      font-weight: bold;
    }

    .brand-tag {
      background: var(--amarelo);
      color: var(--azul-marinho);
      font-weight: bold;
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 999px;
    }

    .sub {
      color: var(--texto-suave);
      font-size: 0.84rem;
      margin-bottom: 12px;
    }

    label {
      display: block;
      margin-top: 10px;
      margin-bottom: 4px;
      font-size: 0.85rem;
      color: var(--amarelo);
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--azul-borda);
      background: var(--azul-marinho);
      color: var(--texto);
      font-size: 0.95rem;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--amarelo);
    }

    .campo-acao {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .campo-acao input {
      flex: 1;
    }

    .btn-acao {
      padding: 10px 12px;
      border: 1px solid var(--amarelo);
      border-radius: 8px;
      background: #12355e;
      color: var(--amarelo);
      font-weight: bold;
      font-size: 0.82rem;
      cursor: pointer;
      white-space: nowrap;
    }

    .sugestoes {
      margin-top: 6px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .sugestao-item {
      padding: 8px 10px;
      border-radius: 8px;
      background: var(--azul-marinho);
      border: 1px solid var(--amarelo);
      color: var(--texto);
      font-size: 0.82rem;
      text-align: left;
      cursor: pointer;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 10px;
      text-align: center;
    }

    .btn-amarelo {
      background: var(--amarelo);
      color: var(--azul-marinho);
    }

    .btn-amarelo:hover {
      background: var(--amarelo-hover);
    }

    .btn-verde {
      background: var(--verde);
      color: #ffffff;
    }

    .btn-azul {
      background: #12355e;
      color: var(--texto);
      border: 1px solid var(--amarelo);
    }

    .card {
      margin-top: 14px;
      padding: 12px;
      border-radius: 10px;
      background: var(--azul-marinho);
      border: 1px solid var(--azul-borda);
    }

    .card-titulo {
      color: var(--amarelo);
      font-weight: bold;
      font-size: 0.92rem;
      margin-bottom: 6px;
      display: block;
    }

    .notice {
      margin-top: 8px;
      font-size: 0.84rem;
      color: var(--amarelo);
      min-height: 18px;
    }

    .saved-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 8px;
      margin-top: 8px;
      border-radius: 8px;
      background: var(--azul-card);
      border: 1px solid var(--azul-borda);
      font-size: 0.84rem;
    }

    .mini-btns {
      display: flex;
      gap: 6px;
    }

    .mini-btn {
      padding: 6px 9px;
      border: none;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: bold;
      cursor: pointer;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header-brand">
      <div class="brand-title">32 ENTREGAS</div>
      <span class="brand-tag">32 BIKE • CLIENTE</span>
    </div>
    <div class="sub">Solicitação de entrega, GPS e envio para o painel do entregador</div>

    <label for="nomeCliente">Nome do Cliente</label>
    <input id="nomeCliente" type="text" placeholder="Ex: Tati" />

    <label for="origem">Origem / Retirada (GPS ou endereço)</label>
    <div class="campo-acao">
      <input id="origem" type="text" placeholder="Ex: Balneário Cassino ou use o GPS" />
      <button type="button" class="btn-acao" id="btnGPS">Usar GPS</button>
    </div>

    <label for="destino">Destino / Entrega (Rua ou endereço)</label>
    <div class="campo-acao">
      <input id="destino" type="text" placeholder="Digite a rua e toque em Buscar" />
      <button type="button" class="btn-acao" id="btnBuscarRua">Buscar Rua</button>
    </div>
    <div class="sugestoes" id="listaSugestoesRua"></div>

    <label for="modal">Modal</label>
    <select id="modal">
      <option value="Bicicleta">Bicicleta</option>
      <option value="Moto">Moto</option>
      <option value="Carro">Carro</option>
    </select>

    <button type="button" class="btn btn-amarelo" id="btnSalvarCliente">Salvar Dados do Cliente</button>
    <button type="button" class="btn btn-azul" id="btnLimparCampos">Limpar Campos</button>
    <button type="button" class="btn btn-verde" id="btnEnviarEntregador">Enviar para o Painel do Entregador</button>
    <div class="notice" id="aviso"></div>

    <div class="card">
      <span class="card-titulo">Clientes Salvos neste Aparelho</span>
      <div id="listaClientesSalvos"></div>
    </div>
  </div>

  <script>
    const CHAVE_CLIENTES = 'clientes32Entregas_azulAmarelo_v2';
    const CHAVE_CHAMADO = 'chamadoEntregador32Entregas_v2';

    function lerClientes() {
      try {
        return JSON.parse(localStorage.getItem(CHAVE_CLIENTES) || '[]');
      } catch (e) {
        return [];
      }
    }

    function gravarClientes(lista) {
      try {
        localStorage.setItem(CHAVE_CLIENTES, JSON.stringify(lista));
      } catch (e) {}
    }

    function mostrarAviso(texto) {
      document.getElementById('aviso').textContent = texto || '';
    }

    function pegarDadosFormulario() {
      return {
        nome: document.getElementById('nomeCliente').value.trim(),
        origem: document.getElementById('origem').value.trim(),
        destino: document.getElementById('destino').value.trim(),
        modal: document.getElementById('modal').value
      };
    }

    async function usarLocalizacaoGPS() {
      if (!navigator.geolocation) {
        mostrarAviso('GPS não disponível neste navegador.');
        return;
      }

      mostrarAviso('Buscando localização atual no GPS...');

      navigator.geolocation.getCurrentPosition(
        async (pos) => {
          const lat = pos.coords.latitude.toFixed(6);
          const lon = pos.coords.longitude.toFixed(6);
          const campoOrigem = document.getElementById('origem');
          campoOrigem.value = `GPS: ${lat}, ${lon}`;

          try {
            const resp = await fetch(
              `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}`,
              { headers: { 'Accept': 'application/json' } }
            );
            if (resp.ok) {
              const data = await resp.json();
              const addr = data.address || {};
              const rua = addr.road || addr.pedestrian || addr.suburb || '';
              const bairro = addr.suburb || addr.neighbourhood || '';
              const cidade = addr.city || addr.town || addr.village || '';
              const resumo = [rua, bairro, cidade].filter(Boolean).join(', ');
              if (resumo) {
                campoOrigem.value = resumo;
              }
            }
            mostrarAviso('Localização atual preenchida na Origem.');
          } catch (e) {
            mostrarAviso('Coordenadas do GPS preenchidas na Origem.');
          }
        },
        () => {
          mostrarAviso('Permita o acesso ao GPS no celular para puxar a localização atual.');
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    async function buscarRuaDestino() {
      const campoDestino = document.getElementById('destino');
      const sugestoesEl = document.getElementById('listaSugestoesRua');
      const busca = campoDestino.value.trim();

      sugestoesEl.innerHTML = '';
      if (!busca) {
        mostrarAviso('Digite o nome da rua no Destino para buscar.');
        return;
      }

      mostrarAviso('Buscando ruas...');
      const consulta = encodeURIComponent(`${busca}, Rio Grande, RS, Brasil`);

      try {
        const resp = await fetch(
          `https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=4&q=${consulta}`,
          { headers: { 'Accept': 'application/json' } }
        );
        const resultados = resp.ok ? await resp.json() : [];

        if (!resultados.length) {
          mostrarAviso('Nenhuma rua encontrada; você pode manter o endereço digitado.');
          return;
        }

        sugestoesEl.innerHTML = resultados.map((item, idx) => {
          const a = item.address || {};
          const rua = a.road || item.name || busca;
          const bairro = a.suburb || a.neighbourhood || '';
          const cidade = a.city || a.town || a.village || 'Rio Grande';
          const textoCurto = [rua, bairro, cidade].filter(Boolean).join(', ');
          return `<button type="button" class="sugestao-item" data-idx="${idx}">${textoCurto}</button>`;
        }).join('');

        sugestoesEl.querySelectorAll('.sugestao-item').forEach(btn => {
          btn.addEventListener('click', () => {
            campoDestino.value = btn.textContent;
            sugestoesEl.innerHTML = '';
            mostrarAviso('Rua selecionada no Destino.');
          });
        });

        mostrarAviso('Toque em uma rua sugerida para preencher o Destino.');
      } catch (e) {
        mostrarAviso('Sem conexão para buscar rua agora; digite o endereço manualmente.');
      }
    }

    function salvarCliente() {
      const dados = pegarDadosFormulario();
      if (!dados.nome) {
        mostrarAviso('Informe o nome do cliente para salvar.');
        return;
      }

      const lista = lerClientes();
      const registro = Object.assign({ id: Date.now() }, dados);
      const idx = lista.findIndex(c => c.nome.toLowerCase() === dados.nome.toLowerCase());

      if (idx >= 0) {
        lista[idx] = registro;
        mostrarAviso(`Cliente "${dados.nome}" atualizado.`);
      } else {
        lista.unshift(registro);
        mostrarAviso(`Cliente "${dados.nome}" salvo.`);
      }

      gravarClientes(lista);
      renderizarLista();
    }

    function carregarCliente(id) {
      const item = lerClientes().find(c => c.id === id);
      if (!item) return;

      document.getElementById('nomeCliente').value = item.nome || '';
      document.getElementById('origem').value = item.origem || '';
      document.getElementById('destino').value = item.destino || '';
      document.getElementById('modal').value = item.modal || 'Bicicleta';
      document.getElementById('listaSugestoesRua').innerHTML = '';
      mostrarAviso(`Dados de "${item.nome}" carregados.`);
    }

    function excluirCliente(id) {
      const lista = lerClientes().filter(c => c.id !== id);
      gravarClientes(lista);
      renderizarLista();
      mostrarAviso('Cadastro removido.');
    }

    function limparCampos() {
      ['nomeCliente', 'origem', 'destino'].forEach(id => {
        document.getElementById(id).value = '';
      });
      document.getElementById('modal').value = 'Bicicleta';
      document.getElementById('listaSugestoesRua').innerHTML = '';
      mostrarAviso('Campos limpos.');
    }

    function enviarParaPainelEntregador() {
      const dados = pegarDadosFormulario();
      if (!dados.nome || !dados.origem || !dados.destino) {
        mostrarAviso('Preencha Nome do Cliente, Origem e Destino antes de enviar.');
        return;
      }

      const chamado = Object.assign({}, dados, {
        status: 'Enviado ao entregador',
        atualizadoEm: new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })
      });

      try {
        localStorage.setItem(CHAVE_CHAMADO, JSON.stringify(chamado));
        mostrarAviso(`Pedido enviado para o painel do entregador (${chamado.atualizadoEm}).`);
      } catch (e) {
        mostrarAviso('Não foi possível salvar no navegador deste aparelho.');
      }
    }

    function renderizarLista() {
      const alvo = document.getElementById('listaClientesSalvos');
      const lista = lerClientes();

      if (!lista.length) {
        alvo.innerHTML = '<div class="sub" style="margin:6px 0 0;">Nenhum cliente salvo ainda.</div>';
        return;
      }

      alvo.innerHTML = lista.map(c => `
        <div class="saved-item">
          <div>
            <strong style="color:#ffd400;">${c.nome}</strong><br />
            <span style="color:#b8cde6;">${c.origem || 'Sem origem'} → ${c.destino || 'Sem destino'} (${c.modal})</span>
          </div>
          <div class="mini-btns">
            <button type="button" class="mini-btn" style="background:#198754;" data-usar="${c.id}">Usar</button>
            <button type="button" class="mini-btn" style="background:#dc3545;" data-excluir="${c.id}">X</button>
          </div>
        </div>
      `).join('');

      alvo.querySelectorAll('[data-usar]').forEach(btn => {
        btn.addEventListener('click', () => carregarCliente(Number(btn.getAttribute('data-usar'))));
      });

      alvo.querySelectorAll('[data-excluir]').forEach(btn => {
        btn.addEventListener('click', () => excluirCliente(Number(btn.getAttribute('data-excluir'))));
      });
    }

    document.getElementById('btnGPS').addEventListener('click', usarLocalizacaoGPS);
    document.getElementById('btnBuscarRua').addEventListener('click', buscarRuaDestino);
    document.getElementById('btnSalvarCliente').addEventListener('click', salvarCliente);
    document.getElementById('btnLimparCampos').addEventListener('click', limparCampos);
    document.getElementById('btnEnviarEntregador').addEventListener('click', enviarParaPainelEntregador);

    renderizarLista();
  </script>
</body>
</html>
