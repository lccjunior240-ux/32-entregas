<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>32 Entregas &amp; 32 Bike — Pedido e Aceite</title>
  <style>
    :root {
      --azul-marinho: #0B1F3A;
      --azul-escuro: #071528;
      --amarelo: #FFD400;
      --amarelo-suave: #FFF4B8;
      --branco: #FFFFFF;
      --cinza: #F4F6F9;
      --preto: #111111;
      --verde: #177A36;
    }

    * {
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      margin: 0;
      padding: 14px;
      background-color: var(--cinza);
      color: var(--preto);
    }

    .app {
      max-width: 540px;
      margin: 0 auto;
      padding-bottom: 36px;
    }

    .topo {
      background: var(--azul-marinho);
      border: 3px solid var(--preto);
      border-bottom: 5px solid var(--amarelo);
      border-radius: 16px;
      padding: 12px 14px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      box-shadow: 4px 4px 0px var(--preto);
    }

    .logos-duplas {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .selo-bike {
      width: 62px;
      height: 62px;
      min-width: 62px;
      border-radius: 50%;
      background: var(--amarelo);
      border: 2.5px solid var(--preto);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4px;
      box-shadow: 2px 2px 0px var(--azul-escuro);
    }

    .selo-bike svg {
      width: 22px;
      height: 15px;
      stroke: var(--preto);
      fill: none;
      stroke-width: 2.3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .selo-bike span {
      font-size: 0.58rem;
      font-weight: 900;
      line-height: 1.05;
      color: var(--preto);
      margin-top: 2px;
    }

    .selo-entregas {
      background: var(--amarelo);
      border: 2.5px solid var(--preto);
      border-radius: 10px;
      padding: 6px 9px;
      min-width: 70px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow: 2px 2px 0px var(--azul-escuro);
    }

    .selo-entregas .letra-e {
      font-size: 1.25rem;
      font-weight: 900;
      line-height: 1;
      color: var(--preto);
    }

    .selo-entregas .nome-baixo {
      font-size: 0.56rem;
      font-weight: 900;
      line-height: 1.1;
      color: var(--preto);
      margin-top: 2px;
      text-transform: uppercase;
    }

    .titulo-topo {
      color: var(--branco);
      text-align: right;
    }

    .titulo-topo h1 {
      margin: 0;
      font-size: 1rem;
      font-weight: 900;
      color: var(--amarelo);
    }

    .titulo-topo p {
      margin: 3px 0 0;
      font-size: 0.72rem;
      font-weight: 700;
      color: #DCE6F2;
    }

    .barra-som {
      background: var(--branco);
      border: 2px solid var(--preto);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      font-weight: 800;
    }

    .btn-mini {
      padding: 7px 10px;
      border: 2px solid var(--preto);
      border-radius: 8px;
      background: var(--amarelo);
      color: var(--preto);
      font-size: 0.78rem;
      font-weight: 900;
      cursor: pointer;
    }

    .card {
      background: var(--branco);
      border: 2px solid var(--preto);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
      box-shadow: 3px 3px 0px var(--preto);
    }

    .card h2 {
      margin: 0 0 10px;
      font-size: 0.96rem;
      font-weight: 900;
      color: var(--azul-marinho);
      text-transform: uppercase;
    }

    label {
      display: block;
      font-size: 0.84rem;
      font-weight: 800;
      margin-top: 8px;
      margin-bottom: 4px;
    }

    input, select {
      width: 100%;
      padding: 10px;
      border: 2px solid var(--preto);
      border-radius: 8px;
      background: var(--branco);
      color: var(--preto);
      font-size: 0.92rem;
      font-weight: 700;
    }

    .btn {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: 2px solid var(--preto);
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 900;
      cursor: pointer;
    }

    .btn-azul {
      background: var(--azul-marinho);
      color: var(--amarelo);
    }

    .btn-amarelo {
      background: var(--amarelo);
      color: var(--preto);
    }

    .btn-verde {
      background: var(--verde);
      color: var(--branco);
    }

    .btn-dinamica {
      background: var(--branco);
      color: var(--azul-marinho);
    }

    .btn-dinamica.ativa {
      background: var(--amarelo);
      color: var(--preto);
    }

    .caixa-resumo {
      margin-top: 10px;
      padding: 11px;
      border-radius: 10px;
      border: 2px solid var(--preto);
      background: var(--amarelo-suave);
      font-size: 0.85rem;
      font-weight: 700;
      white-space: pre-line;
    }

    .chamado-card {
      margin-top: 10px;
      padding: 11px;
      border-radius: 10px;
      border: 2px solid var(--preto);
      background: var(--cinza);
      font-size: 0.84rem;
      font-weight: 700;
    }

    .chamado-card.aceito {
      background: var(--amarelo-suave);
    }

    .status-tag {
      display: inline-block;
      padding: 3px 7px;
      border: 1.5px solid var(--preto);
      border-radius: 6px;
      background: var(--branco);
      font-size: 0.75rem;
      font-weight: 900;
      margin-bottom: 6px;
    }

    .bloco-acerto {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 2px dashed var(--preto);
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topo">
      <div class="logos-duplas">
        <div class="selo-bike" aria-label="32 Bike">
          <svg viewBox="0 0 32 20">
            <circle cx="7" cy="14" r="4.5"></circle>
            <circle cx="25" cy="14" r="4.5"></circle>
            <path d="M7 14 L13 14 L18 7 L25 14"></path>
            <path d="M13 14 L16 6 L19 6"></path>
            <path d="M18 7 L17 4 L21 4"></path>
          </svg>
          <span>32 Bike</span>
        </div>

        <div class="selo-entregas" aria-label="32 Entregas">
          <div class="letra-e">E</div>
          <div class="nome-baixo">32 Entregas</div>
        </div>
      </div>

      <div class="titulo-topo">
        <h1>32 ENTREGAS</h1>
        <p>32 Bike &amp; Despacho • 80% / 20%</p>
      </div>
    </header>

    <div class="barra-som">
      <span id="estado-som">Som do alarme: Ativo</span>
      <div>
        <button type="button" class="btn-mini" onclick="testarAlarme()">Testar Som</button>
        <button type="button" class="btn-mini" onclick="alternarSom()">Mudo / Som</button>
      </div>
    </div>

    <div class="card">
      <h2>1. Pedido de Entrega</h2>

      <label for="o-que-pega">O que vai levar?</label>
      <input type="text" id="o-que-pega" placeholder="Ex: Caixa com peça / Sacola / Encomenda" />

      <label for="onde-pega">Onde pega?</label>
      <input type="text" id="onde-pega" placeholder="Ex: Oficina / Comércio / Rua e número" />

      <label for="onde-leva">Onde entrega?</label>
      <input type="text" id="onde-leva" placeholder="Ex: Retífica / Cliente / Endereço de destino" />

      <label for="modal-pedido">Modal</label>
      <select id="modal-pedido" onchange="atualizarPreviaPedido()">
        <option value="32 Bike" selected>32 Bike</option>
        <option value="Moto">Moto</option>
        <option value="Carro">Carro</option>
      </select>

      <label for="valor-base">Valor da entrega (de R$ 10 a R$ 60)</label>
      <select id="valor-base" onchange="atualizarPreviaPedido()">
        <option value="10" selected>R$ 10,00</option>
        <option value="15">R$ 15,00</option>
        <option value="20">R$ 20,00</option>
        <option value="25">R$ 25,00</option>
        <option value="30">R$ 30,00</option>
        <option value="35">R$ 35,00</option>
        <option value="40">R$ 40,00</option>
        <option value="45">R$ 45,00</option>
        <option value="50">R$ 50,00</option>
        <option value="55">R$ 55,00</option>
        <option value="60">R$ 60,00</option>
      </select>

      <label for="pagamento-pedido">Pagamento</label>
      <select id="pagamento-pedido">
        <option value="Pix (53999089980)">Pix (53999089980)</option>
        <option value="Acerto na retirada">Acerto na retirada</option>
        <option value="Acerto na entrega">Acerto na entrega</option>
      </select>

      <button type="button" class="btn btn-azul" onclick="enviarChamado()">ENVIAR CHAMADO (COM ALARME)</button>
      <button type="button" class="btn btn-verde" onclick="copiarPix()">COPIAR CHAVE PIX: 53999089980</button>

      <div id="previa-pedido" class="caixa-resumo">Preencha os dados para enviar o chamado.</div>
    </div>

    <div class="card">
      <h2>2. Aceite e Acerto (Entregador / Motorista)</h2>
      <div id="lista-aceite">Nenhum chamado aguardando aceite no momento.</div>
    </div>
  </div>

  <script>
    const CHAVE_PIX = "53999089980";
    let somLigado = true;
    let audioCtx = null;
    let chamados = [];

    function grana(v) {
      return "R$ " + Number(v).toFixed(2).replace(".", ",");
    }

    function tocarBipe(tipo) {
      if (!somLigado) return;
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === "suspended") {
          audioCtx.resume();
        }

        const agora = audioCtx.currentTime;
        const notas = tipo === "aceito" ? [660, 880] : [587, 784, 587];

        for (let i = 0; i < notas.length; i++) {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = "triangle";
          osc.frequency.value = notas[i];

          gain.gain.setValueAtTime(0.18, agora + i * 0.14);
          gain.gain.exponentialRampToValueAtTime(0.001, agora + i * 0.14 + 0.12);

          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(agora + i * 0.14);
          osc.stop(agora + i * 0.14 + 0.13);
        }
      } catch (e) {}
    }

    function testarAlarme() {
      somLigado = true;
      document.getElementById("estado-som").textContent = "Som do alarme: Ativo";
      tocarBipe("chegada");
    }

    function alternarSom() {
      somLigado = !somLigado;
      document.getElementById("estado-som").textContent = somLigado
        ? "Som do alarme: Ativo"
        : "Som do alarme: Mudo";
    }

    function atualizarPreviaPedido() {
      const modal = document.getElementById("modal-pedido").value;
      const valor = parseFloat(document.getElementById("valor-base").value);
      const repasse80 = valor * 0.8;
      const parte20 = valor * 0.2;

      document.getElementById("previa-pedido").textContent =
        "Modal: " + modal +
        "\nValor base: " + grana(valor) +
        "\nDivisão base: 80% Entregador (" + grana(repasse80) + ") | 20% 32 Entregas (" + grana(parte20) + ")";
    }

    function enviarChamado() {
      const item = document.getElementById("o-que-pega").value.trim() || "Entrega de mercadoria";
      const origem = document.getElementById("onde-pega").value.trim() || "A confirmar";
      const destino = document.getElementById("onde-leva").value.trim() || "A confirmar";
      const modal = document.getElementById("modal-pedido").value;
      const valorBase = parseFloat(document.getElementById("valor-base").value);
      const pagamento = document.getElementById("pagamento-pedido").value;

      chamados.unshift({
        id: Date.now(),
        item: item,
        origem: origem,
        destino: destino,
        modal: modal,
        valorBase: valorBase,
        valorFinal: valorBase,
        dinamica20: false,
        pagamento: pagamento,
        responsavel: "Entregador / Motorista",
        aceito: false
      });

      tocarBipe("chegada");
      renderChamados();
    }

    function calcularFinal(c) {
      const base = Number(c.valorFinal);
      return c.dinamica20 ? base * 1.2 : base;
    }

    function alternarDinamica(idx) {
      chamados[idx].dinamica20 = !chamados[idx].dinamica20;
      renderChamados();
    }

    function alterarValorManual(idx, novoValor) {
      const num = parseFloat(novoValor);
      if (!isNaN(num) && num >= 0) {
        chamados[idx].valorFinal = num;
        renderChamados();
      }
    }

    function alterarResponsavel(idx, nome) {
      chamados[idx].responsavel = nome;
    }

    function aceitarChamado(idx) {
      const respSelect = document.getElementById("resp-" + idx);
      if (respSelect) {
        chamados[idx].responsavel = respSelect.value;
      }
      chamados[idx].aceito = true;
      tocarBipe("aceito");
      renderChamados();
    }

    function montarResumoAcerto(c) {
      const total = calcularFinal(c);
      const repasse80 = total * 0.8;
      const parte20 = total * 0.2;

      return (
        "*32 ENTREGAS — ACERTO E ACEITE*\n" +
        "Modal: " + c.modal + "\n" +
        "Responsável: " + c.responsavel + "\n" +
        "Item: " + c.item + "\n" +
        "Pegar em: " + c.origem + "\n" +
        "Entregar em: " + c.destino + "\n" +
        "Pagamento: " + c.pagamento + "\n" +
        "Dinâmica (+20%): " + (c.dinamica20 ? "SIM" : "NÃO") + "\n" +
        "Valor final: " + grana(total) + " (80% Entregador: " + grana(repasse80) + " | 20% 32 Entregas: " + grana(parte20) + ")"
      );
    }

    function copiarAcerto(idx) {
      const texto = montarResumoAcerto(chamados[idx]);
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(texto);
      }
      alert("Resumo do aceite e acerto copiado!");
    }

    function renderChamados() {
      const alvo = document.getElementById("lista-aceite");
      if (chamados.length === 0) {
        alvo.innerHTML = "Nenhum chamado aguardando aceite no momento.";
        return;
      }

      alvo.innerHTML = "";
      for (let i = 0; i < chamados.length; i++) {
        const c = chamados[i];
        const total = calcularFinal(c);
        const repasse80 = total * 0.8;
        const parte20 = total * 0.2;
        const msgHtml = montarResumoAcerto(c).replace(/\n/g, "<br>");

        alvo.innerHTML +=
          "<div class='chamado-card " + (c.aceito ? "aceito" : "") + "'>" +
            "<div class='status-tag'>" + (c.aceito ? "ACEITO — " + c.responsavel : "AGUARDANDO ACEITE") + "</div>" +
            "<div><strong>" + c.modal + "</strong> — " + c.item + "</div>" +
            "<div>Pegar em: " + c.origem + "</div>" +
            "<div>Entregar em: " + c.destino + "</div>" +
            "<div class='bloco-acerto'>" +
              "<label for='resp-" + i + "'>Quem vai fazer a entrega</label>" +
              "<select id='resp-" + i + "' onchange='alterarResponsavel(" + i + ", this.value)'>" +
                "<option value='32 Bike (Entregador Bike)'" + (c.responsavel === "32 Bike (Entregador Bike)" ? " selected" : "") + ">32 Bike (Entregador Bike)</option>" +
                "<option value='Motorista / Entregador 32'" + (c.responsavel === "Motorista / Entregador 32" ? " selected" : "") + ">Motorista / Entregador 32</option>" +
                "<option value='Parceiro disponível'" + (c.responsavel === "Parceiro disponível" ? " selected" : "") + ">Parceiro disponível</option>" +
              "</select>" +
              "<label for='val-manual-" + i + "'>Valor ajustado da corrida (R$ — ex: 18 ou 20)</label>" +
              "<input type='number' id='val-manual-" + i + "' step='0.50' min='0' value='" + Number(c.valorFinal).toFixed(2) + "' onchange='alterarValorManual(" + i + ", this.value)' />" +
              "<button type='button' class='btn btn-dinamica " + (c.dinamica20 ? "ativa" : "") + "' onclick='alternarDinamica(" + i + ")'>" +
                (c.dinamica20 ? "DINÂMICA +20%: LIGADA (CHUVA / PICO)" : "DINÂMICA +20%: DESLIGADA") +
              "</button>" +
              "<div class='caixa-resumo'>" +
                "Valor final da corrida: " + grana(total) +
                "\n80% Entregador / Motorista: " + grana(repasse80) +
                "\n20% 32 Entregas: " + grana(parte20) +
              "</div>" +
              "<button type='button' class='btn btn-verde' onclick='aceitarChamado(" + i + ")'>" +
                (c.aceito ? "ATUALIZAR ACEITE (SINAL SONORO)" : "ACEITAR CORRIDA (SINAL SONORO)") +
              "</button>" +
              (c.aceito
                ? "<div class='caixa-resumo'>" + msgHtml + "</div>" +
                  "<button type='button' class='btn btn-amarelo' onclick='copiarAcerto(" + i + ")'>COPIAR RESUMO PARA WHATSAPP</button>"
                : "") +
            "</div>" +
          "</div>";
      }
    }

    function copiarPix() {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(CHAVE_PIX);
      }
      alert("Chave Pix copiada: " + CHAVE_PIX);
    }

    atualizarPreviaPedido();
  </script>
</body>
</html>
