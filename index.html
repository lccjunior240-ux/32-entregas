<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>32 Entregas &amp; 32 Bike</title>
  <style>
    :root {
      --fundo: #070D1D;
      --card: #101A33;
      --card-escuro: #0B1326;
      --borda: #283B66;
      --amarelo: #F5C400;
      --texto: #FFFFFF;
      --suave: #B4C3E0;
      --verde: #26D07C;
      --vermelho: #FF5C5C;
    }

    * {
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      margin: 0;
      padding: 14px;
      background: var(--fundo);
      color: var(--texto);
      font-size: 16px;
      line-height: 1.4;
    }

    .app {
      max-width: 520px;
      margin: 0 auto;
      padding-bottom: 48px;
    }

    .topo-amarelo {
      background: var(--amarelo);
      color: #091124;
      border-radius: 16px;
      border: 3px solid #091124;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .topo-esq {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-circulo {
      width: 60px;
      height: 60px;
      min-width: 60px;
      border-radius: 50%;
      background: var(--amarelo);
      border: 4px solid #091124;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow: 2px 2px 0px #091124;
    }

    .logo-circulo svg {
      width: 26px;
      height: 16px;
      stroke: #091124;
      fill: none;
      stroke-width: 2.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .logo-circulo span {
      font-size: 0.62rem;
      font-weight: 900;
      line-height: 1.05;
      margin-top: 2px;
    }

    .marca-texto h1 {
      margin: 0;
      font-size: 1.2rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .marca-texto h1 .tag-32 {
      background: #091124;
      color: var(--amarelo);
      border: 2px solid #091124;
      padding: 2px 7px;
      border-radius: 7px;
      font-size: 1.05rem;
    }

    .marca-texto p {
      margin: 3px 0 0;
      font-size: 0.82rem;
      font-weight: 800;
      color: #111A2E;
    }

    .badge-lat {
      background: #091124;
      color: var(--amarelo);
      border: 2px solid #091124;
      font-size: 0.76rem;
      font-weight: 900;
      padding: 7px 9px;
      border-radius: 9px;
      white-space: nowrap;
    }

    .abas {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .aba-btn {
      padding: 12px 6px;
      border-radius: 12px;
      border: 2px solid var(--borda);
      background: var(--card);
      color: var(--texto);
      font-weight: 900;
      font-size: 0.92rem;
      cursor: pointer;
    }

    .aba-btn.ativa {
      background: var(--amarelo);
      color: #091124;
      border-color: var(--amarelo);
    }

    .aviso-acao {
      background: var(--card);
      border: 2px solid var(--amarelo);
      color: var(--amarelo);
      border-radius: 12px;
      padding: 11px 13px;
      font-size: 0.94rem;
      font-weight: 800;
      margin-bottom: 14px;
      min-height: 44px;
      display: flex;
      align-items: center;
    }

    .card {
      background: var(--card);
      border: 2px solid var(--borda);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .card h2 {
      margin: 0 0 12px;
      font-size: 1.2rem;
      font-weight: 900;
      color: var(--amarelo);
    }

    .card h3 {
      margin: 18px 0 8px;
      font-size: 1.05rem;
      font-weight: 900;
      color: var(--amarelo);
    }
