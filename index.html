<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>32E Entregas &amp; 32 Bike — Logística Local</title>
  <style>
    :root {
      --branco: #FFFFFF;
      --cinza: #F6F6F6;
      --amarelo-vivo: #FFE600;
      --amarelo-destaque: #FFF04D;
      --preto: #111111;
      --verde: #177A36;
    }

    * {
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      margin: 0;
      padding: 14px;
      background-color: var(--branco);
      color: var(--preto);
    }

    .container {
      max-width: 560px;
      margin: 0 auto;
      padding-bottom: 36px;
    }

    .topo-32e {
      background: var(--amarelo-vivo);
      border: 3px solid var(--preto);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      box-shadow: 4px 4px 0px var(--preto);
    }

    .marca-32e {
      margin: 0;
      font-size: 1.55rem;
      font-weight: 900;
      letter-spacing: -0.4px;
      color: var(--preto);
    }

    .marca-32e span {
      background: var(--preto);
      color: var(--amarelo-vivo);
      padding: 1px 6px;
      border-radius: 6px;
      margin-right: 4px;
    }

    .sub-32e {
      margin: 5px 0 0;
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--preto);
    }

    .btn-redondo {
      width: 56px;
      height: 56px;
      min-width: 56px;
      border-radius: 50%;
      background: var(--amarelo-destaque);
      border: 3px solid var(--preto);
      color: var(--preto);
      font-size: 0.72rem;
      font-weight: 900;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 2px 2px 0px var(--preto);
    }

    .card {
      background: var(--branco);
      border: 2px solid var(--preto);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
      box-shadow: 3px 3px 0px var(--preto);
    }

    .card h2 {
      margin: 0 0 10px;
      font-size: 1rem;
      font-weight: 900;
      text-transform: uppercase;
    }

    label {
      display: block;
      font-weight: 800;
      font-size: 0.85rem;
      margin-top: 8px;
      margin-bottom: 4px;
    }

    input, select {
      width: 100%;
      padding: 10px;
      border: 2px solid var(--preto);
      border-radius: 8px;
      background: var(--branco);
      color: var(--preto);
      font-size: 0.92rem;
      font-weight: 700;
    }

    .btn {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: 2px solid var(--preto);
      border-radius: 8px;
      font-weight: 900;
      font-size: 0.92rem;
      cursor: pointer;
    }

    .btn-preto {
      background: var(--preto);
      color: var(--amarelo-vivo);
    }

    .btn-amarelo {
      background: var(--amarelo-vivo);
      color: var(--preto);
    }

    .btn-verde {
      background: var(--verde);
      color: #FFFFFF;
    }

    .caixa {
      background: var(--cinza);
      border: 2px solid var(--preto);
      border-radius: 10px;
      padding: 11px;
      font-size: 0.86rem;
      font-weight: 700;
      white-space: pre-line;
      margin-top: 10px;
    }

    .chamado {
      background: var(--amarelo-destaque);
      border: 2px solid var(--preto);
      border-radius: 10px;
      padding: 10px;
      margin-top: 10px;
      font-size: 0.85rem;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="topo-32e">
      <div>
        <h1 class="marca-32e"><span>32E</span> ENTREGAS</h1>
        <p class="sub-32e">32 Bike &amp; Logística Local • 80% Entregador / 20% 32E</p>
      </div>
      <button type="button" class="btn-redondo" onclick="alternarBase()">
        <span id="status-base">Base</span>
      </button>
    </header>

    <div class="card">
      <h2>1. Retirada no Comércio</h2>
      <label for="comercio">Comércio / Estabelecimento</label>
      <input type="text" id="comercio" placeholder="Ex: Mercado / Farmácia / Loja" />

      <label for="retirada">Endereço de retirada</label>
      <input type="text" id="retirada" placeholder="Ex: Rua principal, 230 - Cassino" />

      <label for="obs">Detalhes do pedido</label>
      <input type="text" id="obs" placeholder="Ex: Sacola pronta / Entrega rápida" />
    </div>

    <div class="card">
      <h2>2. Destino, Modal e Repasse</h2>
      <label for="destino">Endereço de entrega</label>
      <input type="text" id="destino" placeholder="Ex: Av. Rio Grande, 500 - Cassino" />

      <label for="modal">Modal de entrega</label>
      <select id="modal" onchange="atualizarPrevia()">
        <option value="32 Bike|6.00" selected>32 Bike — Taxa R$ 6,00</option>
        <option value="Moto|10.00">Moto — Taxa R$ 10,00</option>
        <option value="Carro|15.00">Carro — Taxa R$ 15,00</option>
      </select>

      <label for="entregador">Entregador escalado</label>
      <select id="entregador">
        <option value="32 Bike (Ciclista Parceiro)">32 Bike (Ciclista Parceiro)</option>
        <option value="Junior (32E Entregas)">Junior (32E Entregas)</option>
        <option value="Motoboy Parceiro">Motoboy Parceiro</option>
      </select>

      <label for="pagamento">Forma de acerto</label>
      <select id="pagamento">
        <option value="Pix (53999089980)">Pix (53999089980)</option>
        <option value="Acerto no comércio">Acerto no comércio</option>
        <option value="Acerto na entrega">Acerto na entrega</option>
      </select>

      <button type="button" class="btn btn-preto" onclick="gerarChamado()">GERAR CHAMADO</button>
      <button type="button" class="btn btn-amarelo" onclick="copiarWhatsApp()">COPIAR RESUMO WHATSAPP</button>
      <button type="button" class="btn btn-verde" onclick="copiarPix()">COPIAR PIX: 53999089980</button>

      <div id="painel-calculo" class="caixa">Selecione o modal ou preencha os campos para calcular.</div>
    </div>

    <div class="card">
      <h2>3. Chamados Registrados</h2>
      <div id="lista-chamados">Nenhum chamado registrado ainda.</div>
    </div>
  </div>

  <script>
    const PIX_32E = "53999089980";
    let chamados = [];
    let textoAtual = "";
    let ativa = false;

    function real(v) {
      return "R$ " + Number(v).toFixed(2).replace(".", ",");
    }

    function alternarBase() {
      ativa = !ativa;
      document.getElementById("status-base").textContent = ativa ? "On" : "Base";
    }

    function lerDados() {
      const partes = document.getElementById("modal").value.split("|");
      return {
        comercio: document.getElementById("comercio").value.trim() || "Comércio parceiro",
        retirada: document.getElementById("retirada").value.trim() || "A confirmar",
        obs: document.getElementById("obs").value.trim() || "Entrega padrão",
        destino: document.getElementById("destino").value.trim() || "A confirmar",
        modal: partes[0],
        taxa: parseFloat(partes[1]),
        entregador: document.getElementById("entregador").value,
        pagamento: document.getElementById("pagamento").value
      };
    }

    function montarMensagem(d) {
      const repasse80 = d.taxa * 0.8;
      const parte20 = d.taxa * 0.2;
      return (
        "*32E ENTREGAS — CHAMADO*\n" +
        "Modal: " + d.modal + "\n" +
        "Entregador: " + d.entregador + "\n" +
        "Retirar em: " + d.comercio + " (" + d.retirada + ")\n" +
        "Obs: " + d.obs + "\n" +
        "Entregar em: " + d.destino + "\n" +
        "Pagamento: " + d.pagamento + "\n" +
        "Taxa: " + real(d.taxa) + " | Entregador (80%): " + real(repasse80) + " | 32E (20%): " + real(parte20)
      );
    }

    function atualizarPrevia() {
      const d = lerDados();
      const repasse80 = d.taxa * 0.8;
      const parte20 = d.taxa * 0.2;
      textoAtual = montarMensagem(d);

      document.getElementById("painel-calculo").textContent =
        "Modal: " + d.modal +
        "\nTaxa total: " + real(d.taxa) +
        "\nEntregador (80%): " + real(repasse80) +
        "\n32E Entregas (20%): " + real(parte20) +
        "\nEntregador: " + d.entregador;
    }

    function gerarChamado() {
      const d = lerDados();
      const repasse80 = d.taxa * 0.8;
      const parte20 = d.taxa * 0.2;
      const msg = montarMensagem(d);
      textoAtual = msg;

      chamados.unshift({
        msg: msg,
        resumo: d.modal + " • " + d.comercio + " → " + d.destino + " (" + real(d.taxa) + " | 80%: " + real(repasse80) + " / 20%: " + real(parte20) + ")"
      });

      document.getElementById("painel-calculo").textContent = msg;
      desenharChamados();
    }

    function desenharChamados() {
      const alvo = document.getElementById("lista-chamados");
      if (chamados.length === 0) {
        alvo.innerHTML = "Nenhum chamado registrado ainda.";
        return;
      }

      alvo.innerHTML = "";
      for (let i = 0; i < chamados.length; i++) {
        alvo.innerHTML +=
          "<div class='chamado'>" +
            "<div>" + chamados[i].resumo + "</div>" +
            "<button type='button' class='btn btn-preto' style='margin-top:8px;' onclick='copiarItem(" + i + ")'>Copiar Chamado #" + (chamados.length - i) + "</button>" +
          "</div>";
      }
    }

    function copiarItem(idx) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(chamados[idx].msg);
      }
      alert("Chamado copiado para o WhatsApp!");
    }

    function copiarWhatsApp() {
      if (!textoAtual) {
        atualizarPrevia();
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(textoAtual);
      }
      alert("Resumo copiado para o WhatsApp!");
    }

    function copiarPix() {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(PIX_32E);
      }
      alert("Chave Pix copiada: " + PIX_32E);
    }

    atualizarPrevia();
  </script>
</body>
</html>
