<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>32 Entregas — Lojas e Entregas Locais</title>
  <style>
    :root {
      --branco: #FFFFFF;
      --cinza-claro: #F7F7F7;
      --amarelo: #F5B800;
      --amarelo-claro: #FFD23F;
      --creme: #FFF6CC;
      --preto: #111111;
      --verde: #1B7F3A;
    }

    * {
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      margin: 0;
      padding: 14px;
      background-color: var(--branco);
      color: var(--preto);
    }

    .container {
      max-width: 560px;
      margin: 0 auto;
      padding-bottom: 36px;
    }

    .cabecalho-32 {
      background: var(--amarelo);
      border: 3px solid var(--preto);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      box-shadow: 4px 4px 0px var(--preto);
    }

    .cabecalho-titulo {
      margin: 0;
      font-size: 1.55rem;
      font-weight: 900;
      letter-spacing: -0.4px;
      color: var(--preto);
    }

    .cabecalho-sub {
      margin: 4px 0 0;
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--preto);
    }

    .btn-login-redondo {
      width: 58px;
      height: 58px;
      min-width: 58px;
      border-radius: 50%;
      background: var(--amarelo-claro);
      border: 3px solid var(--preto);
      color: var(--preto);
      font-size: 0.72rem;
      font-weight: 900;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow: 2px 2px 0px var(--preto);
    }

    .btn-login-redondo:active {
      transform: translate(1px, 1px);
    }

    .status-login {
      background: var(--cinza-claro);
      border: 2px solid var(--preto);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 0.82rem;
      font-weight: 800;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .abas {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .aba-btn {
      padding: 11px 6px;
      border: 2px solid var(--preto);
      border-radius: 10px;
      background: var(--branco);
      color: var(--preto);
      font-weight: 900;
      font-size: 0.82rem;
      cursor: pointer;
    }

    .aba-btn.ativa {
      background: var(--amarelo);
      color: var(--preto);
      box-shadow: 2px 2px 0px var(--preto);
    }

    .card {
      background: var(--branco);
      border: 2px solid var(--preto);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
      box-shadow: 3px 3px 0px var(--preto);
    }

    .card h2 {
      margin: 0 0 10px;
      font-size: 1rem;
      font-weight: 900;
      text-transform: uppercase;
    }

    .lojas-grade {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .btn-loja {
      padding: 12px 6px;
      border: 2px solid var(--preto);
      border-radius: 10px;
      background: var(--cinza-claro);
      color: var(--preto);
      font-weight: 900;
      font-size: 0.92rem;
      cursor: pointer;
    }

    .btn-loja.ativa {
      background: var(--amarelo);
      color: var(--preto);
      box-shadow: 2px 2px 0px var(--preto);
    }

    .loja-aberta-banner {
      margin-top: 10px;
      padding: 10px;
      border-radius: 10px;
      border: 2px solid var(--preto);
      background: var(--creme);
      font-size: 0.86rem;
      font-weight: 800;
    }

    .linha-prod {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 9px 0;
      border-bottom: 1px solid #D9D9D9;
    }

    .linha-prod:last-child {
      border-bottom: none;
    }

    .prod-nome {
      font-weight: 800;
      font-size: 0.92rem;
    }

    .prod-valor {
      font-weight: 700;
      font-size: 0.84rem;
      color: #333333;
    }

    label {
      display: block;
      font-weight: 800;
      font-size: 0.85rem;
      margin-top: 8px;
      margin-bottom: 4px;
    }

    input, select {
      width: 100%;
      padding: 10px;
      border: 2px solid var(--preto);
      border-radius: 8px;
      background: var(--branco);
      color: var(--preto);
      font-size: 0.92rem;
      font-weight: 700;
    }

    .btn {
      padding: 8px 12px;
      border: 2px solid var(--preto);
      border-radius: 8px;
      background: var(--amarelo);
      color: var(--preto);
      font-weight: 900;
      font-size: 0.84rem;
      cursor: pointer;
    }

    .btn-preto {
      background: var(--preto);
      color: var(--amarelo);
    }

    .btn-verde {
      background: var(--verde);
      color: #FFFFFF;
    }

    .btn-cheio {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      font-size: 0.94rem;
    }

    .caixa {
      background: var(--cinza-claro);
      border: 2px solid var(--preto);
      border-radius: 10px;
      padding: 10px;
      font-size: 0.86rem;
      font-weight: 700;
      white-space: pre-line;
      margin-top: 8px;
    }

    .item-pedido {
      background: var(--creme);
      border: 2px solid var(--preto);
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 10px;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .escondido {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- CABEÇALHO 32 ENTREGAS -->
    <header class="cabecalho-32">
      <div>
        <h1 class="cabecalho-titulo">32 ENTREGAS</h1>
        <p class="cabecalho-sub">Balneário Cassino &amp; Rio Grande • 80% Entregador / 20% 32 Entregas</p>
      </div>
      <button type="button" class="btn-login-redondo" onclick="alternarLogin()">
        <span id="rotulo-login">Entrar</span>
      </button>
    </header>

    <div class="status-login">
      <span id="texto-sessao">Modo: Visitante</span>
      <span id="contador-itens">Carrinho: 0 item(ns)</span>
    </div>

    <!-- ABAS DE NAVEGAÇÃO -->
    <div class="abas">
      <button type="button" id="tab-cliente" class="aba-btn ativa" onclick="irPara('cliente')">1. Cliente</button>
      <button type="button" id="tab-loja" class="aba-btn" onclick="irPara('loja')">2. Loja</button>
      <button type="button" id="tab-admin" class="aba-btn" onclick="irPara('admin')">3. Admin</button>
    </div>

    <!-- TELA 1: CLIENTE (3 LOJAS + PRODUTOS + PIX) -->

          <button type="button" id="card-loja-2" class="btn-loja" onclick="abrirLoja('Loja 2')">Loja 2</button>
          <button type="button" id="card-loja-3" class="btn-loja" onclick="abrirLoja('Loja 3')">Loja 3</button>
        </div>
