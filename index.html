<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=yes" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="manifest" href="manifest-passageiro.json?v=40" />
  <link rel="icon" type="image/png" href="icon-512.png" />
  <link rel="apple-touch-icon" href="icon-512.png" />
  <title>32 Entrega — Cliente V40</title>
  <style>
    :root {
      --bg: #ffffff;
      --card: #f8fafc;
      --navy-header: linear-gradient(145deg, #0b192c 0%, #13294b 75%, #0c1e38 100%);
      --border: #cbd5e1;
      --text: #0f172a;
      --muted: #334155;
      --accent: #f59e0b;
      --green: #059669;
      --blue: #0369a1;
      --f-base: 19px;
      --f-label: 18px;
      --f-btn: 19px;
      --f-title: 22px;
    }
    body.fonte-grande {
      --f-base: 23px;
      --f-label: 22px;
      --f-btn: 22px;
      --f-title: 26px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-size: var(--f-base);
      line-height: 1.5;
    }
    header {
      background: var(--navy-header);
      border-bottom: 4px solid var(--accent);
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 1000;
      color: #ffffff;
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand img {
      width: 50px;
      height: 50px;
      border-radius: 12px;
      border: 2px solid var(--accent);
      background: #ffffff;
      flex-shrink: 0;
    }
    h1 { font-size: 21px; font-weight: 900; color: var(--accent); }
    .subtitle { font-size: 15px; color: #e2e8f0; font-weight: 600; }
    .header-acoes { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .btn-colar-topo {
      background: #ffffff;
      color: #0f172a;
      border: 2px solid var(--accent);
      border-radius: 10px;
      padding: 8px 11px;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }
    .btn-colar-topo:active {
      background: var(--accent);
      color: #0f172a;
    }
    .btn-acess {
      background: #ffffff;
      color: #0f172a;
      border: 2px solid var(--accent);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-acess.ativo {
      background: var(--accent);
      color: #0f172a;
    }
    main {
      flex: 1;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
    }
    .box-colar-rapido {
      display: none;
      background: #f8fafc;
      border: 2px solid var(--accent);
      border-radius: 14px;
      padding: 12px;
      flex-direction: column;
      gap: 8px;
    }
    .box-colar-rapido.ativo {
      display: flex;
    }
    .box-colar-rapido textarea {
      width: 100%;
      min-height: 90px;
      padding: 12px;
      border-radius: 10px;
      border: 2px solid #64748b;
      background: #ffffff;
      color: #0f172a;
      font-size: 15px;
      font-family: monospace;
      resize: vertical;
    }
    .aviso-firebase {
      display: none;
      background: #fffbeb;
      border: 2px solid #d97706;
      color: #78350f;
      border-radius: 14px;
      padding: 14px;
      font-size: var(--f-label);
      font-weight: 700;
    }
    .card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 3px 10px rgba(15, 23, 42, 0.06);
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .card-title { font-size: var(--f-title); font-weight: 900; color: #0f172a; }
    label.campo-lbl {
      font-size: var(--f-label);
      font-weight: 900;
      color: #0f172a;
      margin-bottom: 6px;
      display: block;
    }
    input, select {
      width: 100%;
      min-height: 56px;
      padding: 14px 16px;
      border-radius: 14px;
      border: 2px solid #64748b;
      background: #ffffff;
      color: #0f172a;
      font-size: var(--f-base);
      font-weight: 700;
    }
    input::placeholder { color: #64748b; }
    .btn {
      width: 100%;
      min-height: 58px;
      padding: 15px 18px;
      border: none;
      border-radius: 14px;
      font-size: var(--f-btn);
      font-weight: 900;
      cursor: pointer;
    }
    .btn-sm {
      min-height: 46px;
      padding: 10px 14px;
      font-size: 16px;
      width: auto;
    }
    .btn-outline {
      background: #ffffff;
      color: #0f172a;
      border: 2px solid #64748b;
    }
    .btn-accent {
      background: var(--accent);
      color: #0f172a;
      border: 2px solid #b45309;
    }
    .btn-green {
      background: #059669;
      color: #ffffff;
    }
    .status-msg { font-size: var(--f-label); font-weight: 900; color: #047857; text-align: center; min-height: 24px; }
    .erro-msg { font-size: var(--f-label); font-weight: 900; color: #b91c1c; text-align: center; min-height: 20px; }
    .corrida-box {
      background: #ffffff;
      border: 2px solid #94a3b8;
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      color: #0f172a;
    }
    .alerta-aceita {
      background: #ecfdf5;
      border: 2px solid #059669;
      color: #064e3b;
      border-radius: 12px;
      padding: 14px;
      font-weight: 900;
      font-size: var(--f-label);
    }
    .chegada-destaque {
      background: #fffbeb;
      border: 2px solid #d97706;
      color: #78350f;
      border-radius: 12px;
      padding: 14px;
      font-weight: 900;
      font-size: var(--f-label);
    }
    .pix-box {
      background: #f0f9ff;
      border: 2px solid #0284c7;
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      color: #0c4a6e;
    }
    .pix-chave-linha {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      background: #ffffff;
      border: 2px solid #0284c7;
      border-radius: 10px;
      padding: 12px;
      font-weight: 900;
      word-break: break-all;
      color: #0f172a;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="icon-512.png" alt="32 Entrega" />
      <div>
        <h1>32 Entrega — Cliente</h1>
        <div class="subtitle">V40 • Cassino &amp; Rio Grande</div>
      </div>
    </div>
    <div class="header-acoes">
      <button class="btn-colar-topo" type="button" id="btn-colar-topo" title="Colar texto ou código">
        <span>📥</span>
        <span id="txt-colar-topo">Colar</span>
      </button>
      <button class="btn-acess" type="button" id="btn-fonte-grande" aria-pressed="false">
        Letra A+
      </button>
    </div>
  </header>

  <main>
    <div class="box-colar-rapido" id="box-colar-rapido">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
        <strong style="font-size:15px;color:#b45309;">Área para Colar</strong>
        <button class="btn btn-outline btn-sm" type="button" id="btn-fechar-colar">Fechar</button>
      </div>
      <textarea id="area-colar-texto" placeholder="Cole aqui o texto ou código da área de transferência..."></textarea>
    </div>

    <div class="aviso-firebase" id="aviso-firebase"></div>

    <section class="card">
      <div class="card-header">
        <div class="card-title">1. Pedir Entrega</div>
        <button class="btn btn-outline btn-sm" type="button" id="btn-ler-voz">
          Ouvir Resumo
        </button>
      </div>

      <div>
        <label class="campo-lbl" for="pas-nome">Seu Nome</label>
        <input id="pas-nome" type="text" placeholder="Como podemos te chamar?" />
      </div>

      <div>
        <label class="campo-lbl" for="pas-origem">Onde buscar a entrega?</label>
        <input id="pas-origem" type="text" placeholder="Digite a rua, número e bairro" />
      </div>

      <div>
        <label class="campo-lbl" for="pas-destino">Onde entregar?</label>
        <input id="pas-destino" type="text" placeholder="Digite o endereço de entrega (rua, número, bairro)" />
      </div>

      <div>
        <label class="campo-lbl" for="pas-pagamento">Como você vai pagar?</label>
        <select id="pas-pagamento">
          <option value="Pix">Pix</option>
          <option value="Dinheiro">Dinheiro</option>
          <option value="Cartão">Cartão</option>
        </select>
      </div>

      <div class="erro-msg" id="erro-rota"></div>

      <button class="btn btn-accent" type="button" id="btn-solicitar-corrida">
        Chamar Entregador
      </button>
      <div class="status-msg" id="msg-passageiro"></div>
    </section>

    <section class="card">
      <div class="card-header">
        <div class="card-title">2. Sua Entrega</div>
        <button class="btn btn-outline btn-sm" type="button" id="btn-limpar-corrida">
          Limpar Tela
        </button>
      </div>
      <div id="box-corrida-ativa" class="corrida-box">
        Nenhuma entrega solicitada ainda.
      </div>
    </section>
  </main>

  <script>
    (function () {
      const avisoFirebase = document.getElementById("aviso-firebase");
      const msgPassageiro = document.getElementById("msg-passageiro");
      const erroRota = document.getElementById("erro-rota");
      const boxCorridaAtiva = document.getElementById("box-corrida-ativa");
      const elNome = document.getElementById("pas-nome");
      const elOrigem = document.getElementById("pas-origem");
      const elDestino = document.getElementById("pas-destino");
      const elPagamento = document.getElementById("pas-pagamento");
      const btnSolicitar = document.getElementById("btn-solicitar-corrida");
      const btnLimparCorrida = document.getElementById("btn-limpar-corrida");
      const btnFonteGrande = document.getElementById("btn-fonte-grande");
      const btnLerVoz = document.getElementById("btn-ler-voz");
      const btnColarTopo = document.getElementById("btn-colar-topo");
      const txtColarTopo = document.getElementById("txt-colar-topo");
      const boxColarRapido = document.getElementById("box-colar-rapido");
