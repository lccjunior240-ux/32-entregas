<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>32 Entregas &amp; 32 Bike</title>
  <style>
    :root {
      --fundo: #070D1D;
      --card: #101A33;
      --card-escuro: #0B1326;
      --borda: #283B66;
      --amarelo: #F5C400;
      --texto: #FFFFFF;
      --suave: #B4C3E0;
      --verde: #26D07C;
      --vermelho: #FF5C5C;
    }

    * {
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      margin: 0;
      padding: 14px;
      background: var(--fundo);
      color: var(--texto);
      font-size: 16px;
      line-height: 1.4;
    }

    .app {
      max-width: 520px;
      margin: 0 auto;
      padding-bottom: 44px;
    }

    .topo-amarelo {
      background: var(--amarelo);
      color: #091124;
      border-radius: 16px;
      border: 3px solid #091124;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .topo-esq {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-circulo {
      width: 60px;
      height: 60px;
      min-width: 60px;
      border-radius: 50%;
      background: var(--amarelo);
      border: 4px solid #091124;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow: 2px 2px 0px #091124;
    }

    .logo-circulo svg {
      width: 26px;
      height: 16px;
      stroke: #091124;
      fill: none;
      stroke-width: 2.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .logo-circulo span {
      font-size: 0.62rem;
      font-weight: 900;
      line-height: 1.05;
      margin-top: 2px;
    }

    .marca-texto h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .marca-texto h1 .tag-32 {
      background: #091124;
      color: var(--amarelo);
      border: 2px solid #091124;
      padding: 2px 7px;
      border-radius: 7px;
      font-size: 1.1rem;
    }

    .marca-texto p {
      margin: 3px 0 0;
      font-size: 0.85rem;
      font-weight: 800;
      color: #111A2E;
    }

    .badge-lat {
      background: #091124;
      color: var(--amarelo);
      border: 2px solid #091124;
      font-size: 0.78rem;
      font-weight: 900;
      padding: 7px 9px;
      border-radius: 9px;
      white-space: nowrap;
    }

    .abas {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }

    .aba-btn {
      padding: 13px 10px;
      border-radius: 12px;
      border: 2px solid var(--borda);
      background: var(--card);
      color: var(--texto);
      font-weight: 900;
      font-size: 1rem;
      cursor: pointer;
    }

    .aba-btn.ativa {
      background: var(--amarelo);
      color: #091124;
      border-color: var(--amarelo);
    }

    .aviso-acao {
      background: var(--card);
      border: 2px solid var(--amarelo);
      color: var(--amarelo);
      border-radius: 12px;
      padding: 11px 13px;
      font-size: 0.95rem;
      font-weight: 800;
      margin-bottom: 14px;
      min-height: 44px;
      display: flex;
      align-items: center;
    }

    .card {
      background: var(--card);
      border: 2px solid var(--borda);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .card h2 {
      margin: 0 0 12px;
      font-size: 1.2rem;
      font-weight: 900;
      color: var(--amarelo);
    }

    .card h3 {
      margin: 18px 0 8px;
      font-size: 1.05rem;
      font-weight: 900;
      color: var(--amarelo);
    }

    label {
      display: block;
      font-size: 1rem;
      font-weight: 800;
      color: #FFFFFF;
      margin-top: 12px;
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: 2px solid var(--borda);
      background: var(--card-escuro);
      color: var(--texto);
      font-size: 1rem;
      font-weight: 700;
    }

    .linha-acao {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
    }

    .grade-tempo {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 8px;
    }

    .btn-tempo {
      padding: 12px 6px;
      border-radius: 10px;
      border: 2px solid var(--borda);
      background: var(--card-escuro);
      color: var(--texto);
      font-size: 0.92rem;
      font-weight: 900;
      cursor: pointer;
    }

    .btn-tempo.escolhido {
      background: var(--verde);
      color: #06130C;
      border-color: var(--verde);
    }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 11px;
      border: none;
      font-size: 1rem;
      font-weight: 900;
      cursor: pointer;
      margin-top: 12px;
    }

    .btn-amarelo {
      background: var(--amarelo);
      color: #091124;
    }

    .btn-escuro {
      background: var(--card-escuro);
      color: var(--texto);
      border: 2px solid var(--borda);
    }

    .btn-verde {
      background: var(--verde);
      color: #06130C;
    }

    .btn-vermelho {
      background: var(--vermelho);
      color: #160404;
    }

    .btn-dinamica {
      background: var(--card-escuro);
      color: var(--amarelo);
      border: 2px solid var(--amarelo);
    }

    .btn-dinamica.ligada {
      background: var(--amarelo);
      color: #091124;
    }

    .btn-pequeno {
      margin-top: 0;
      width: auto;
      padding: 13px;
      font-size: 0.9rem;
      white-space: nowrap;
    }

    .info-gps {
      font-size: 0.9rem;
      color: var(--suave);
      margin-top: 6px;
      font-weight: 700;
    }

    .retorno-cliente-box {
      margin-top: 10px;
      padding: 12px;
      border-radius: 12px;
      background: var(--card-escuro);
      border: 2px solid var(--borda);
      font-size: 0.95rem;
    }

    .retorno-status {
      font-weight: 900;
      font-size: 1rem;
      margin-bottom: 6px;
    }

    .status-verde { color: var(--verde); }
    .status-vermelho { color: var(--vermelho); }
    .status-amarelo { color: var(--amarelo); }

    .caixa-empresa {
      margin-top: 16px;
      padding: 13px;
      border-radius: 12px;
      background: var(--card-escuro);
      border: 2px solid var(--borda);
      font-size: 0.92rem;
      color: var(--suave);
    }

    .caixa-empresa strong {
      color: var(--amarelo);
      font-size: 1rem;
      display: block;
      margin-bottom: 4px;
    }

    .chamado-item {
      background: var(--card-escuro);
      border: 2px solid var(--borda);
      border-radius: 14px;
      padding: 14px;
      margin-top: 12px;
    }

    .chamado-item.amarrado {
      border-color: var(--verde);
    }

    .grade-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .caixa-divisao {
      margin-top: 12px;
      padding: 12px;
      border-radius: 10px;
      border: 2px dashed #4E679A;
      background: #081022;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      text-align: center;
    }

    .caixa-divisao small {
      display: block;
      font-size: 0.8rem;
      color: var(--suave);
      margin-bottom: 3px;
    }

    .caixa-divisao strong {
      font-size: 1.02rem;
      font-weight: 900;
    }

    .cor-branco { color: var(--texto); }
    .cor-verde { color: var(--verde); }
    .cor-amarelo { color: var(--amarelo); }

    .bloco-acumulado {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 2px solid var(--borda);
    }

    .msg-box {
      margin-top: 12px;
      padding: 12px;
      border-radius: 10px;
      background: #081022;
      border: 2px solid var(--borda);
      font-size: 0.92rem;
      line-height: 1.45;
      white-space: pre-line;
      color: #FFFFFF;
    }

    .oculto {
      display: none;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topo-amarelo">
      <div class="topo-esq">
        <div class="logo-circulo" aria-label="32 Bike">
          <svg viewBox="0 0 32 20
